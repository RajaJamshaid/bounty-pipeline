name = "bounty-discovery"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bounty-discovery"
database_id = "5b94bed2-1ce3-4a54-a7c7-55491645019b"

[vars]
MAX_AGE_HOURS = "12"
# Bounty amount does not decide anything now (any amount passes, unknown amounts too).
# To limit by amount again: set MIN/MAX and ALERT_UNKNOWN_AMOUNT = "false".
MIN_BOUNTY_USD = "0"
MAX_BOUNTY_USD = "1000000"
ALERT_UNKNOWN_AMOUNT = "true"
# Language / keyword rules live at the top of src/index.js.
# Skip when the AI thinks more than this many files must change:
MAX_FILES = "12"
# AI feasibility filter: only alert when the model scores the issue >= MIN_AI_SCORE (0-10)
MIN_AI_SCORE = "6"
# "auto" = look up the currently free OpenRouter models and use the best few.
# Or a comma-separated list of model ids; the next one is tried if one fails.
TRIAGE_MODEL = "auto"
