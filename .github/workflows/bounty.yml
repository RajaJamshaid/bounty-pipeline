name: Autonomous Agency Arbitrage Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_solver:
        description: 'Also run solver.py (auto fork + PR to the target repo). Leave off for human review first.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bounty-pipeline
  cancel-in-progress: false

jobs:
  run-arbitrage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Configure git identity
        run: |
          git config --global user.name "RajaJamshaid"
          git config --global user.email "rajajamshaid22@gmail.com"

      # Clones the target repo with GH_PAT (no interactive prompt),
      # runs npm test / pytest, sends the report to Telegram.
      - name: Run Bounty Review Bot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # Only on manual runs with run_solver = true (needs the human OK first).
      - name: Run Solver (fork + PR)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_solver }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # gh CLI needs the PAT to fork into your account
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python solver.py
